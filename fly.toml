app = "openclaw-brain-hub"
primary_region = "sjc"

[build]

[env]
  STORAGE_DIR = "/data"
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[mounts]
  source = "brain_data"
  destination = "/data"
